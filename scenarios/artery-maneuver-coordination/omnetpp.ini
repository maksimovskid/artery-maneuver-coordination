[General]
network = artery.inet.World

sim-time-limit = 30 s
warmup-period = 5 s

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"


*.node[*].wlan[*].typename = "VanetNic"


*.withPhysicalEnvironment = true
*.physicalEnvironment.groundType = "FlatGround"

*.withObstacles = true

**.ChannelLoad:vector.vector-recording = true
#**.Cam2Mac:vector.vector-recording = true
#**.McmReceivedCounter:vector.vector-recording = true
#**.McmSentCounter:vector.vector-recording = true
#**.packetErrorRate:vector.vector-recording = true
#**.radioChannel:vector.vector-recording = true
#**.LinkLatency:vector.vector-recording = true
#**.delayDcc:vector.vector-recording = true
**.vector-recording = false  # vector not being saved
**.result-recording-modes = all
**.scalar-recording = true

*.radioMedium.pathLossType = "Gemv2"     #  other option is "VanetNakagamiFading" or "TwoRayInterference" or "FreeSpacePathLoss" or "Gemv2"
*.radioMedium.pathLoss.withSmallScaleVariations = false
*.radioMedium.pathLoss.withVisualization = true

#DCC
*.node[*].vanetza[*].dcc.typename = "LimericDccEntity"    # options are LimericDccEntity, FsmDccEntity, NoRateControlDccEntity
*.node[*].vanetza[*].dcc.enableDualAlpha = true

[Config sumo-gui]
*.traci.launcher.sumo = "sumo-gui"

[Config envmod]

network = artery.envmod.World
*.traci.mapper.vehicleType = "artery.envmod.Car"
*.node[*].wlan[*].typename = "VanetNic"
# define two radios 
*.node[*].numRadios = 2

*.node[*].wlan[*].bitrate = 6 Mbps

*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].radio.bandwidth = 10 MHz
*.node[*].wlan[*].radio.transmitter.power = 200 mW

*.node[*].middleware.updateInterval = 0.1s
*.node[*].middleware.datetime = "2018-03-19 10:00:00"
*.node[*].middleware.services = xmldoc("services-mco-envmod.xml")
*.node[*].middleware.MC.usePrerecordedIntentTrajectory = true
*.node[*].middleware.MC.prerecordedTrajectoryCsv = "coordinates_new_map.csv"
*.node[*].middleware.MC.prerecordedTrajectorySteps = 20
*.node[*].middleware.MC.prerecordedTrajectoryDt = 0.25s
*.node[*].middleware.MC.executionRestoreMinFrontDistance = 10.0m
*.node[*].middleware.MC.executionRestoreMinTimeGap = 1.0s
*.node[*].middleware.MC.executionRestoreMinTtc = 2.0s


*.node[*].environmentModel.sensors = xmldoc("sensors.xml")
*.node[*].environmentModel.FrontRadar.fovRange = 200.0 m
*.node[*].environmentModel.FrontRadar.fovAngle = 20.0

# security entity added 
*.node[*].vanetza[*].security.typename = "SecurityEntity"


seed-1-mt = ${seed=10, 20, 30, 40, 50}            # used for all  1, 11, 51, 101, 151

[Config envmod-19CAVs]
extends = envmod
*.traci.launcher.sumocfg = "routes/test_19CAVs.sumocfg"

[Config envmod-19CAVs-merging]
extends = envmod
# Actual SUMO traffic without OMNeT++ nodes/radios; keep adjacent lanes occupied.
*.traci.mapper.unequippedVehicleIds = "background_hl1_1 background_hl1_2 background_hl2_1 background_hl2_2 background_hl2_3 background_hl1_3 background_hl2_4 background_hl2_5 background_hl2_6"
*.traci.mapper.unequippedLaneChangeMode = 512
*.traci.launcher.sumocfg = "routes/test_19CAVs_merging.sumocfg"
*.node[*].middleware.MC.mergingRequestingRouteId = "route_merging_1"
*.node[*].middleware.MC.mergingValidationTriggerX = 216554m
*.node[*].middleware.MC.mergingValidationTriggerY = 452461m
*.node[*].middleware.MC.mergingTriggerGapTimeFactor = 0.5s
*.node[*].middleware.MC.mergingCooperatingLaneIndex = 0
*.node[*].middleware.MC.mergingValidationLaneMinY = 452474m
*.node[*].middleware.MC.mergingValidationLaneMaxY = 452574m
*.node[*].middleware.MC.mergingSnapshotFreshness = 0.6s
*.node[*].middleware.MC.mergingTargetSelectionTimeGap = 1.2s
*.node[*].middleware.MC.mergingMinimumGapSpeed = 1.0mps
*.node[*].middleware.MC.mergingGapWindowFactor = 2.5
*.node[*].middleware.MC.mergingRvExecutionSpeed = 22.22mps
*.node[*].middleware.MC.mergingCvAccelerationTargetSpeed = 33.33mps

[Config envmod-19CAVs-merging-gui]
extends = envmod-19CAVs-merging
*.traci.launcher.sumo = "sumo-gui"

[Config envmod-19CAVs-merging-baseline]
extends = envmod-19CAVs-merging
*.node[*].middleware.services = xmldoc("services-envmod-no-mc.xml")

[Config envmod-19CAVs-merging-baseline-gui]
extends = envmod-19CAVs-merging-baseline
*.traci.launcher.sumo = "sumo-gui"

[Config envmod-19CAVs-merging-animation-data]
extends = envmod-19CAVs-merging
*.traci.launcher.extraOptions = "--statistic-output results_animation/merging/coordinated/statistic.xml --collision-output results_animation/merging/coordinated/collision.xml --fcd-output results_animation/merging/coordinated/fcd.xml --fcd-output.acceleration --fcd-output.distance --lanechange-output results_animation/merging/coordinated/lanechange.xml --lanechange-output.started --lanechange-output.ended --lanechange-output.xy --tripinfo-output results_animation/merging/coordinated/tripinfo.xml --tripinfo-output.write-unfinished"

[Config envmod-19CAVs-merging-baseline-animation-data]
extends = envmod-19CAVs-merging-baseline
*.traci.launcher.extraOptions = "--statistic-output results_animation/merging/baseline/statistic.xml --collision-output results_animation/merging/baseline/collision.xml --fcd-output results_animation/merging/baseline/fcd.xml --fcd-output.acceleration --fcd-output.distance --lanechange-output results_animation/merging/baseline/lanechange.xml --lanechange-output.started --lanechange-output.ended --lanechange-output.xy --tripinfo-output results_animation/merging/baseline/tripinfo.xml --tripinfo-output.write-unfinished"

[Config envmod-19CAVs-emergency-lane-change]
extends = envmod
*.traci.launcher.sumocfg = "routes/test_19CAVs_emergency_lane_change.sumocfg"
*.node[*].middleware.MC.emergencySourceVehicleId = "car_hl0_Emergency"
*.node[*].middleware.MC.emergencyStartTime = 12s
*.node[*].middleware.MC.emergencyDuration = 15s
*.node[*].middleware.MC.emergencyBroadcastInterval = 0.1s
*.node[*].middleware.MC.emergencyNormalSpeed = 27.77mps
*.node[*].middleware.MC.emergencyTargetSpeed = 0.1mps
*.node[*].middleware.MC.laneChangeFollowerRouteId = "route_highway_1"
*.node[*].middleware.MC.laneChangeTargetCvRouteId = "route_highway_2"
*.node[*].middleware.MC.laneChangePlannedLateralShift = 3.0m
*.node[*].middleware.MC.laneChangeValidationLaneCorrectionThresholdY = 452365m
*.node[*].middleware.MC.laneChangeExecutionStepCount = 10
*.node[*].middleware.MC.laneChangeExecutionLateralShiftPerStep = 0.32m
*.node[*].middleware.MC.laneChangeDesiredMinimumTimeGap = 1.0s
*.node[*].middleware.MC.laneChangeCoordinationConflictTimeGap = 1.5s
*.node[*].middleware.MC.laneChangePaperInitialTimeGap = 1.22s
*.node[*].middleware.MC.laneChangeExecutionMinFrontDistance = 5.0m
*.node[*].middleware.MC.laneChangeExecutionMinTimeGap = 0.3s
*.node[*].middleware.MC.laneChangeExecutionMinTtc = 1.0s
*.node[*].middleware.MC.laneChangeFallbackSpeed = 0.1mps
*.node[*].middleware.MC.laneChangeFallbackDecelerationTime = 1.0s

[Config envmod-19CAVs-emergency-lane-change-gui]
extends = envmod-19CAVs-emergency-lane-change
*.traci.launcher.sumo = "sumo-gui"

[Config envmod-19CAVs-emergency-lane-change-baseline]
extends = envmod-19CAVs-emergency-lane-change
*.node[*].middleware.MC.emergencyBrakingOnlyBaseline = true

[Config envmod-19CAVs-emergency-lane-change-baseline-gui]
extends = envmod-19CAVs-emergency-lane-change-baseline
*.traci.launcher.sumo = "sumo-gui"

[Config envmod-19CAVs-emergency-lane-change-animation-data]
extends = envmod-19CAVs-emergency-lane-change
*.traci.launcher.extraOptions = "--fcd-output results_animation/lane_change/coordinated/fcd.xml --fcd-output.acceleration --fcd-output.distance --lanechange-output results_animation/lane_change/coordinated/lanechange.xml --lanechange-output.started --lanechange-output.ended --lanechange-output.xy --tripinfo-output results_animation/lane_change/coordinated/tripinfo.xml --tripinfo-output.write-unfinished"

[Config envmod-19CAVs-emergency-lane-change-baseline-animation-data]
extends = envmod-19CAVs-emergency-lane-change-baseline
*.traci.launcher.extraOptions = "--fcd-output results_animation/lane_change/baseline/fcd.xml --fcd-output.acceleration --fcd-output.distance --lanechange-output results_animation/lane_change/baseline/lanechange.xml --lanechange-output.started --lanechange-output.ended --lanechange-output.xy --tripinfo-output results_animation/lane_change/baseline/tripinfo.xml --tripinfo-output.write-unfinished"

[Config envmod-19CAVs-second-request-smoke]
extends = envmod-19CAVs-emergency-lane-change
# Optional validation-only config. It forces one selected CV to reject its
# first high-priority lane-change Request so the RV second-request path is
# exercised deterministically.
*.node[*].middleware.MC.forceFirstCvRejectForSecondRequestSmoke = true
*.node[*].middleware.MC.forceFirstCvRejectStationId = 309

[Config envmod-200CAVs]
extends = envmod
*.traci.launcher.sumocfg = "routes/test_200CAVs.sumocfg"

[Config envmod-200CAVs-qos-baseline-freespace]
extends = envmod-200CAVs
# Experimental congested QoS baseline. The existing 19 maneuver-coordination
# vehicles remain the coordination participants; additional CAVs are background
# load vehicles that transmit regular Intent MCMs using fallback trajectory
# columns (others_x/others_y = 1/1) where no route-specific CSV trajectory
# exists. With the two-service envmod service list they may also transmit CAMs.
# Background MCMs/CAMs are communication-load traffic, not coordination
# participants.
*.radioMedium.pathLossType = "FreeSpacePathLoss"
*.node[*].middleware.MC.newGenMcmRules = false
*.node[*].middleware.MC.newGenMcmRulesIntent = false
*.node[*].middleware.MC.newGenMcmRulesIntent1Hz_MCO = false
*.node[*].middleware.MC.dccProfiles = false

[Config envmod-200CAVs-qos-adapt-intent-freespace]
extends = envmod-200CAVs-qos-baseline-freespace
*.node[*].middleware.MC.newGenMcmRules = true
*.node[*].middleware.MC.newGenMcmRulesIntent = true
*.node[*].middleware.MC.newGenMcmRulesIntent1Hz_MCO = false
*.node[*].middleware.MC.dccProfiles = false

[Config envmod-200CAVs-qos-mco-1hz-freespace]
extends = envmod-200CAVs-qos-baseline-freespace
*.node[*].middleware.MC.newGenMcmRules = false
*.node[*].middleware.MC.newGenMcmRulesIntent = false
*.node[*].middleware.MC.newGenMcmRulesIntent1Hz_MCO = true
*.node[*].middleware.MC.dccProfiles = false

[Config envmod-200CAVs-qos-dcc-profiles-freespace]
extends = envmod-200CAVs-qos-baseline-freespace
*.node[*].middleware.MC.newGenMcmRules = false
*.node[*].middleware.MC.newGenMcmRulesIntent = false
*.node[*].middleware.MC.newGenMcmRulesIntent1Hz_MCO = false
*.node[*].middleware.MC.dccProfiles = true

[Config envmod-200CAVs-qos-diagnostic]
extends = envmod-200CAVs-qos-baseline-freespace
sim-time-limit = 10 s
cmdenv-event-banners = false
**.cmdenv-log-level = warn
result-dir = results_diagnostic/200cav_qos
output-scalar-file = "${resultdir}/${configname}-seed=${seed}-#${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-seed=${seed}-#${runnumber}.vec"
*.traci.launcher.extraOptions = "--fcd-output results_diagnostic/200cav_qos/fcd.xml --fcd-output.acceleration --fcd-output.distance --tripinfo-output results_diagnostic/200cav_qos/tripinfo.xml --tripinfo-output.write-unfinished"

[Config envmod-200CAVs-qos-diagnostic-30s]
extends = envmod-200CAVs-qos-baseline-freespace
sim-time-limit = 30 s
cmdenv-event-banners = false
**.cmdenv-log-level = warn
result-dir = results_diagnostic/200cav_qos_30s
output-scalar-file = "${resultdir}/${configname}-seed=${seed}-#${runnumber}.sca"
output-vector-file = "${resultdir}/${configname}-seed=${seed}-#${runnumber}.vec"
*.traci.launcher.extraOptions = "--fcd-output results_diagnostic/200cav_qos_30s/fcd.xml --fcd-output.acceleration --fcd-output.distance --tripinfo-output results_diagnostic/200cav_qos_30s/tripinfo.xml --tripinfo-output.write-unfinished"

