name: Run integration tests

on:
  workflow_call:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARTERY_BUILD_DIR: build/Release
      ARTERY_TEST_TIMEOUT: '300'
    container:
      image: ghcr.io/maksimovskid/artery-gh-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Create virtual environment
        run: python3 -m venv .venv

      - name: Install pip dependencies
        run: . .venv/bin/activate && pip install -r tools/ci/requirements.txt

      - name: Test release tooling
        run: . .venv/bin/activate && python3 -m unittest discover -s tests/release -v

      - name: Configure and build CMake
        run: |
          tools/build.py -cb --config Release \
            --generator Ninja                 \
            -D WITH_SIMULTE:BOOL=ON           \
            -D WITH_OTS:BOOL=ON               \
            -D WITH_TESTBED:BOOL=ON           \
            -D WITH_TRANSFUSION:BOOL=ON

      - name: Build focused C++ tests
        run: cmake --build build/Release --target mcm_timing_tests cam_policy_tests --parallel 2

      - name: Run focused C++ tests
        run: ctest --test-dir build/Release -R '^(mcm_timing|cam_policy)$' --output-on-failure

      - name: Run MCM scenario regressions
        run: . .venv/bin/activate && python3 -m unittest discover -s tests/mcm -p 'test_*.py' -v

      - name: Run CAM scenario regressions
        run: . .venv/bin/activate && python3 -m unittest discover -s tests/cam -p 'test_*.py' -v

      - name: Run upstream integration tests
        run: . .venv/bin/activate && PYTHONPATH=$PWD python3 tools/ci/run.py -l build/Release/run-artery.ini -s scenarios
